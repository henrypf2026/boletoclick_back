<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bienvenido a Boletoclick</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: Arial, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td
                align="center"
                style="
                  padding: 30px;
                  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                  color: white;
                "
              >
                <img src="https://res.cloudinary.com/ddsubvh5v/image/upload/v1781399631/boletockick_ztfz0v.jpg" style="margin: 0"></img>
              </td>
            </tr>

            <tr>
              <td style="padding: 40px">
                <h2 style="color: #111827">¡Bienvenido {userName}!</h2>

                <p style="color: #4b5563; font-size: 16px; line-height: 1.6">
                  Gracias por registrarte en Boletoclick. Ya puedes descubrir
                  eventos, comprar boletos y administrar tus compras desde tu
                  cuenta.
                </p>

                <p style="color: #4b5563; font-size: 16px">
                  Estamos emocionados de tenerte con nosotros.
                </p>

                <div style="text-align: center; margin-top: 35px">
                  <a
                    href="https://boletoclick-front.vercel.app/"
                    style="
                      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                      color: white;
                      text-decoration: none;
                      padding: 14px 28px;
                      border-radius: 8px;
                      display: inline-block;
                      font-weight: bold;
                    "
                  >
                    Ir a mi cuenta
                  </a>
                </div>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  background: #f3f4f6;
                  color: #6b7280;
                "
              >
                © 2026 Boletoclick
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
