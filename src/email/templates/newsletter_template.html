<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{newsletterTitle}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: Arial, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                  padding: 30px;
                  text-align: center;
                "
              >
                <img src="https://res.cloudinary.com/ddsubvh5v/image/upload/v1781399631/boletockick_ztfz0v.jpg" style="margin: 0; color: white"></img>
              </td>
            </tr>

            <tr>
              <td>
                <h1
                 width="100%"
                  alt="Newsletter"
                  style="display: block"
                >📢 Boletoclick News</h1>
              </td>
            </tr>

            <tr>
              <td style="padding: 35px">
                <h2 style="color: #111827">Proximos eventos 🍿🎊🎈🎆</h2>

                <p style="color: #4b5563; font-size: 16px; line-height: 1.8">
                  {newsletterContent}
                </p>

                <div style="text-align: center; margin-top: 30px">
                  <a
                    href="https://boletoclick-front.vercel.app/"
                    style="
                      background: #3b82f6;
                      color: white;
                      text-decoration: none;
                      padding: 14px 28px;
                      border-radius: 8px;
                      font-weight: bold;
                    "
                  >
                    Ver más
                  </a>
                </div>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  background: #f3f4f6;
                  color: #6b7280;
                "
              >
                Recibes este correo porque estás suscrito a Boletoclick.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
